# Every source a Lumen model trains or evaluates on. `commercial = false` sources are refused
# by `train.py --ship`. Vetted in docs/THIRD-PARTY-MODELS.md before anything is downloaded.
# kind: "pairs" (original + an edit), "finals" (edited photos, synthetic pairs), "raw" (RAWs, synthetic pairs)

[sources.wikimedia-cc0-pd]
url = "https://commons.wikimedia.org"
licence = "CC0-1.0 / Public Domain (per file)"
commercial = true
kind = "finals"
attribution = false
checked = "2026-10-06"

[sources.wikimedia-cc-by]
url = "https://commons.wikimedia.org"
licence = "CC-BY-4.0 / CC-BY-3.0 (per file)"
commercial = true
kind = "finals"
attribution = true   # credits.csv beside the prepared folder
checked = "2026-10-06"

[sources.openverse-cc0]
url = "https://openverse.org"
licence = "CC0-1.0 / PDM (per item)"
commercial = true
kind = "finals"
attribution = false
checked = "2026-10-06"

[sources.flickr-commons]
url = "https://www.flickr.com/commons"
licence = "No known copyright restrictions (per item)"
commercial = true
kind = "finals"
attribution = false
checked = "2026-10-06"

[sources.raw-pixls-cc0]
