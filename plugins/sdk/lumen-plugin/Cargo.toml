[package]
name = "lumen-plugin"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Safe helpers for writing Lumen plugins (plugin API 1) in Rust."
publish = false

[features]
# Pick the kinds of plugin you write. The matching WIT world is bound: nothing else is imported.
importer = []
tools = []

[dependencies]
serde = "1"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63"
