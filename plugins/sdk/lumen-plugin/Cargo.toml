[package]
name = "lumen-plugin"
version = "1.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Safe helpers for writing Lumen plugins (plugin API 1.4) in Rust."
publish = false

[features]
# Pick the kinds of plugin you write. The matching WIT world is bound: nothing else is imported.
importer = []
tools = []
# API 1.1: a tools plugin that suggests places (world `places-plugin`: tools + review, with
# models, library and places). Not combined with the others.
places = []
# API 1.2: a tools plugin with buttons, stats and lists on its settings page (world `ui-plugin`:
# tools + ui). Not combined with the others.
ui = []
# API 1.3: a tools plugin that proposes places, dates, tags, labels, names, titles and captions for
# the review screen (world `proposals-plugin`: tools + library + proposals). Not combined with the others.
proposals = []

[dependencies]
serde = "1"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63"
