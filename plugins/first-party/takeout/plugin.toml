id = "studio.jl.takeout"
name = "Google Takeout"
version = "1.1.0"
author = "JL Studios"
description = "Imports a Google Takeout of Google Photos: dates, places, titles, descriptions, favourites and albums come from the JSON files next to each photo."
license = "MIT"
lumen = ">=26.2.0"
api = 1
author_url = "https://github.com/05Narwhal"
repository = "https://github.com/05Narwhal/lumen-plugins"
permissions = ["import.read-chosen"]

[importer]
label = "Google Takeout"
pick = "folder"
hint = "Choose the folder with your Takeout"

[[settings]]
key = "albums_from_folders"
label = "Use Takeout's folders as albums"
type = "bool"
default = true

[listing]
screenshots = ["screenshots/import.png"]
