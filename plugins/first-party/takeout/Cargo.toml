[package]
name = "takeout"
version = "1.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lumen-plugin = { path = "../../sdk/lumen-plugin", features = ["importer"] }

serde_json = { version = "1", default-features = false, features = ["std"] }

miniz_oxide = "0.8"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace]
