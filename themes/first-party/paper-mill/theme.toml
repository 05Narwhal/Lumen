id = "jl.paper-mill"
name = "Paper Mill"
version = "1.0.0"
author = "JL Studios"
description = "Warm paper with the navigation along the top."
license = "MIT"
lumen = ">=26.2.0"
homepage = "https://github.com/05Narwhal/lumen-plugins"
base = "paper"
default_scheme = "light"

[light]
bg-base = "oklch(96% 0.02 85)"
bg-raised = "oklch(99% 0.01 85)"
bg-sunken = "oklch(92% 0.03 80)"
develop-stage-bg = "oklch(88% 0.03 80)"
bg-sidebar = "oklch(94% 0.025 82)"
fg-primary = "oklch(26% 0.02 60)"
fg-muted = "oklch(40% 0.03 60)"
fg-subtle = "oklch(46% 0.03 60)"
accent = "oklch(50% 0.12 40)"
accent-hover = "oklch(44% 0.12 40)"
accent-fg = "oklch(100% 0 0)"
border = "oklch(86% 0.04 80)"
radius-sm = "3px"
radius-md = "4px"
radius-lg = "6px"
tile-gap = "4px"

[dark]
bg-base = "oklch(22% 0.02 60)"
bg-raised = "oklch(26% 0.02 60)"
bg-sunken = "oklch(19% 0.02 60)"
develop-stage-bg = "oklch(16% 0.02 60)"
bg-sidebar = "oklch(24% 0.02 60)"
fg-primary = "oklch(92% 0.02 85)"
fg-muted = "oklch(78% 0.03 75)"
fg-subtle = "oklch(70% 0.03 75)"
accent = "oklch(72% 0.12 50)"
accent-hover = "oklch(78% 0.12 50)"
accent-fg = "oklch(22% 0.02 60)"
border = "oklch(34% 0.03 60)"
radius-sm = "3px"
radius-md = "4px"
radius-lg = "6px"
tile-gap = "4px"

[listing]
screenshots = ["screenshots/library-light.png", "screenshots/library-dark.png"]
tags = ["light", "layout"]
