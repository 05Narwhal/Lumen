id = "jl.coastline"
name = "Coastline"
version = "1.0.0"
author = "JL Studios"
description = "Teal water and warm sand, with rounder corners."
license = "MIT"
lumen = ">=26.2.0"
homepage = "https://github.com/05Narwhal/lumen-plugins"
base = "gallery"
default_scheme = "light"

[light]
bg-base = "oklch(97% 0.02 90)"
bg-raised = "oklch(99% 0.01 90)"
bg-sunken = "oklch(93% 0.035 190)"
develop-stage-bg = "oklch(90% 0.04 190)"
bg-sidebar = "oklch(94% 0.03 100)"
fg-primary = "oklch(24% 0.03 220)"
fg-muted = "oklch(40% 0.03 220)"
fg-subtle = "oklch(46% 0.03 220)"
accent = "oklch(48% 0.1 195)"
accent-hover = "oklch(42% 0.1 195)"
accent-fg = "oklch(100% 0 0)"
border = "oklch(88% 0.04 85)"
radius-sm = "10px"
radius-md = "16px"
radius-lg = "22px"
tile-gap = "8px"

[dark]
bg-base = "oklch(20% 0.03 220)"
bg-raised = "oklch(25% 0.035 220)"
bg-sunken = "oklch(17% 0.03 220)"
develop-stage-bg = "oklch(14% 0.03 220)"
bg-sidebar = "oklch(18% 0.03 220)"
fg-primary = "oklch(94% 0.01 90)"
fg-muted = "oklch(80% 0.03 200)"
fg-subtle = "oklch(72% 0.03 200)"
accent = "oklch(74% 0.1 190)"
accent-hover = "oklch(80% 0.1 190)"
accent-fg = "oklch(20% 0.03 220)"
border = "oklch(34% 0.05 200)"
radius-sm = "10px"
radius-md = "16px"
radius-lg = "22px"
tile-gap = "8px"

[listing]
screenshots = ["screenshots/library-light.png", "screenshots/library-dark.png"]
tags = ["light", "colourful"]
