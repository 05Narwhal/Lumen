[package]
name = "photos-ml"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
photos-core = { path = "../photos-core" }
photos-models = { path = "../photos-models" }
ort = "=2.0.0-rc.15"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
# Text in photos (Round 13): contours and the perspective crop for PaddleOCR's post-processing.
image = { version = "0.25", default-features = false }
imageproc = { version = "0.25", default-features = false }

# DirectML for Denoise (Phase 8d); DirectML.dll ships with Windows 10 1903 and later.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.10", features = ["directml"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
