name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit carries a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::$(git log -1 --format='%h %s' "$c") has no Signed-off-by line. Fix it with: git rebase --signoff $BASE"
              bad=1
            fi
          done
          exit $bad
