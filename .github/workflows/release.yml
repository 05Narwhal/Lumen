name: Release

# Runs when a version tag is pushed (`git tag v26.2.0-alpha && git push origin v26.2.0-alpha`). The
# tag's version must already be in package.json, tauri.conf.json and docs/CHANGELOG.md
# (`node scripts/release/set-version.mjs`). The one release path (docs/RELEASING.md):
#
#   ffmpeg-sources  the FFmpeg source bundle, once per FFmpeg build
#   preflight       every gate that needs no build (scripts/release/preflight.mjs before)
#   build           Windows only (the other platforms wait for a self-built FFmpeg with its source):
#                   Lumen Setup and the NSIS installer in their fixed order (setup-build.mjs), then
#                   the gates that need the build (preflight.mjs after), then a draft release
#   publish         the draft goes public, then the update channels point at it
#
# Secrets (Settings → Secrets and variables → Actions), two only:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  signs the updater artefacts
# The plugin public key and the Discord application id are public values, tracked in
# src-tauri/plugin-pubkey.txt and src-tauri/discord_client_id.txt, so a tag builds the same binary
# anywhere. The updater's public key is tracked in tauri.conf.json, so a fork without the signing
# secrets stops at the build rather than shipping an unsigned update.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # preflight reads CI's check runs on the tagged commit.
  checks: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # The exact source of the FFmpeg build Lumen ships, uploaded once per FFmpeg build.
  FFMPEG_SOURCES_TAG: ffmpeg-sources-n9.0.2-47

jobs:
  ffmpeg-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Upload the FFmpeg source bundle once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$FFMPEG_SOURCES_TAG" >/dev/null 2>&1; then
            echo "$FFMPEG_SOURCES_TAG already exists; nothing to upload."
          else
            node scripts/release/ffmpeg-sources.mjs "$FFMPEG_SOURCES_TAG"
          fi

  notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            import { notesFor } from "./scripts/release/lib.mjs";
            const version = process.argv[1];
            const section = notesFor(readFileSync("docs/CHANGELOG.md", "utf8"), version);
            if (!section) { console.error(`docs/CHANGELOG.md has no section for ${version}`); process.exit(1); }
            const body = [
              section, "",
              "**Download `Lumen-Setup-" + version + ".exe`.** It is the installer: it installs, updates, repairs and removes Lumen. The other installer in this release, `Lumen_" + version + "_x64-setup.exe`, is only here because Lumen's own updater installs it; you do not need it.",
              "",
              "Windows only for now. **Unsigned:** Windows SmartScreen will warn when you open the installer: choose *More info* → *Run anyway*. On macOS and Linux, build from source (see the README).",
              "",
              "The exact source of the FFmpeg build is the release `" + process.env.FFMPEG_SOURCES_TAG + "`; every other source is this tag.",
            ].join("\n");
            appendFileSync(process.env.GITHUB_OUTPUT, "body<<LUMEN_NOTES_EOF\n" + body + "\nLUMEN_NOTES_EOF\n");
            appendFileSync(process.env.GITHUB_OUTPUT, "prerelease=" + (version.endsWith("-stable") ? "false" : "true") + "\n");
          ' "$version"

  # Every gate that needs no build. It runs on Windows because the FFmpeg sidecar is a Windows
  # program (`ffmpeg-source` runs it and hashes it).
  preflight:
    needs: ffmpeg-sources
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tag-ref asks which branches contain the tagged commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      # Pinned to the Rust the project builds with: 1.100 lays out target/debug/build/<crate>/<hash>/ differently and ort-sys 2.0.0-rc.10
      # then copies its DLLs to the wrong folder and panics. Raise it together with the ort pin.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - run: yarn install --frozen-lockfile
      - uses: ./.github/actions/windows-sidecars
      - name: Gates before the build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: node scripts/release/preflight.mjs before "${TAG#v}"

  build:
    needs: [preflight, notes]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      # Pinned to the Rust the project builds with: 1.100 lays out target/debug/build/<crate>/<hash>/ differently and ort-sys 2.0.0-rc.10
      # then copies its DLLs to the wrong folder and panics. Raise it together with the ort pin.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            installer/src-tauri
      - run: yarn install --frozen-lockfile
      - uses: ./.github/actions/windows-sidecars
      # ort-sys copies its DLLs next to the program; a runner cannot symlink, so it copies, and the
      # copy fails when `examples/` does not exist on a clean build.
      - name: Folders ort-sys copies into
        shell: pwsh
        run: New-Item -ItemType Directory -Force src-tauri/target/release/examples, src-tauri/target/release/deps | Out-Null

      # Windows code signing: SignPath Foundation plugs in here once the project is approved. It
      # signs through `signCommand` inside setup-build.mjs (the slim Setup, the installer during its
      # build, the full Setup), because the updater's .sig is taken over the finished installer.
      # Until then everything builds unsigned and the release notes say so.
      - name: Build Lumen Setup and the installer
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release/setup-build.mjs "${TAG#v}"

      - name: Gates that need the build
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          node scripts/release/preflight.mjs after "$version" --sizes "dist-release/$version/sizes.json" --exe src-tauri/target/release/lumen.exe

      - name: Make the draft release and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.notes.outputs.body }}
          PRERELEASE: ${{ needs.notes.outputs.prerelease }}
        run: |
          version="${TAG#v}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=(--draft --latest=false)
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}" --title "Lumen $TAG" --notes "$NOTES"
          fi
          # The files setup-build.mjs wrote (its built.json lists the same globs): the NSIS
          # installer the updater takes, its .sig, and the full Setup people download.
          cd src-tauri/target/release/bundle/nsis
          gh release upload "$TAG" --clobber ./*_"${version}"_*-setup.exe* "./Lumen-Setup-${version}.exe"

  publish:
    needs: build
    runs-on: ubuntu-latest
    # One channel update at a time, across tags: channels.mjs reads each manifest before it writes
    # (never lower), so a stable hotfix and an alpha must not interleave their read and write.
    concurrency:
      group: release-channels
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish the draft and point the update channels at it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          dir="$(mktemp -d)"
          gh release download "$TAG" --pattern '*-setup.exe' --pattern '*-setup.exe.sig' --dir "$dir"
          installer="$(basename "$(ls "$dir"/*-setup.exe | head -n 1)")"
          gh release edit "$TAG" --draft=false
          node scripts/release/channels.mjs "$version" "$installer" "$dir/$installer.sig"
