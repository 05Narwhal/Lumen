name: Bug
description: Something in Lumen does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a copy of a library or a few test photos. Never attach photos you want to keep private.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lumen version
      description: Settings → About.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: Optional. Remove anything personal (folder names, people, places) first.
